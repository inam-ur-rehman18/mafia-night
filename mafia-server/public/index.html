<!DOCTYPE html>
<html lang="en" data-theme="noir" data-phase="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mafia Night</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Orbitron:wght@700;900&family=Pirata+One&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{--bg:#0e0b0a;--bg2:#1f1612;--surface:#2a1f19;--line:#5a4435;--ink:#f6ecdf;--muted:#bba68f;--accent:#e0a93f;--on:#1b130d;--accent2:#8c1d2c;--bad:#ff6074;--good:#7bc79a;--disp:"Abril Fatface",Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme=neon]{--bg:#080620;--bg2:#1a0f3d;--surface:#241a5c;--line:#5b3bc0;--ink:#f1ecff;--muted:#a79bd8;--accent:#19f0d0;--on:#06143a;--accent2:#ff2e93;--bad:#ff4d8d;--good:#19f0d0;--disp:Orbitron,Impact,sans-serif}
[data-theme=haunt]{--bg:#0a120e;--bg2:#16261d;--surface:#1e3528;--line:#3f6b55;--ink:#e6efe3;--muted:#97b3a2;--accent:#b6e36b;--on:#10200f;--accent2:#7a3fb5;--bad:#ff7a59;--good:#8fe3b0;--disp:"Pirata One",Georgia,serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(120% 60% at 80% 0%,color-mix(in srgb,var(--accent2) 40%,transparent),transparent 60%),linear-gradient(180deg,var(--bg2),var(--bg) 75%) fixed;background-color:var(--bg);color:var(--ink);font:400 16px/1.45 Figtree,system-ui,sans-serif;overflow-x:hidden}
[data-phase=day] body{background:radial-gradient(120% 70% at 80% 0%,color-mix(in srgb,var(--accent) 45%,transparent),transparent 65%),linear-gradient(180deg,color-mix(in srgb,var(--bg2) 60%,var(--accent)),var(--bg2) 80%) fixed;background-color:var(--bg2)}
.orb{position:fixed;top:16px;right:18px;width:50px;height:50px;border-radius:50%;background:#fff3d6;box-shadow:0 0 50px 14px color-mix(in srgb,#fff3d6 38%,transparent);pointer-events:none;transition:all .8s}
.orb::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--bg2);transform:translate(11px,-6px);transition:all .8s}
[data-phase=day] .orb{background:var(--accent);box-shadow:0 0 70px 24px color-mix(in srgb,var(--accent) 55%,transparent)}
[data-phase=day] .orb::after{opacity:0}
.sky{position:fixed;left:0;right:0;bottom:0;width:100%;height:30vh;pointer-events:none;z-index:0}
.sky .bld{fill:color-mix(in srgb,var(--bg) 85%,#000)}.sky .win rect{fill:var(--accent);animation:tw 3s infinite alternate}
[data-phase=day] .sky .bld{fill:color-mix(in srgb,var(--bg2) 70%,#000)}
.sky .win rect:nth-child(3n){animation-delay:-1s}.sky .win rect:nth-child(3n+1){animation-delay:-2s}
@keyframes tw{from{opacity:.15}to{opacity:.9}}
.fog{position:fixed;left:-20%;right:-20%;bottom:0;height:30%;background:radial-gradient(60% 100% at 30% 100%,color-mix(in srgb,var(--ink) 14%,transparent),transparent),radial-gradient(50% 90% at 75% 100%,color-mix(in srgb,var(--ink) 10%,transparent),transparent);animation:drift 14s ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{to{transform:translateX(12%)}}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:16px 16px 70px}
.page{animation:pin .4s ease-out}@keyframes pin{from{opacity:0;transform:translateY(14px)}}
h1,h2,h3{font-family:var(--disp);font-weight:400;margin:0 0 8px;line-height:1.05}
h1{font-size:38px}h2{font-size:25px;margin-top:18px}h3{font-size:20px}
.big{font-size:clamp(36px,12vw,58px)}
.sub{color:var(--muted);margin:0 0 12px}.c{text-align:center}p{margin:0 0 10px}
.logo{font-family:var(--disp);text-align:center;line-height:.88;color:var(--accent);-webkit-text-stroke:3px #16101f;paint-order:stroke fill;text-shadow:0 4px 0 #16101f,0 8px 0 var(--accent2),0 14px 24px #000a;transform:rotate(-3deg);margin:6px 0 22px}
.logo span{display:block;font-size:clamp(64px,22vw,104px)}.logo span+span{font-size:clamp(48px,17vw,80px);color:var(--ink)}
.top{display:flex;align-items:center;gap:8px;margin:0 64px 12px 0;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--surface) 88%,transparent);border:2px solid var(--line);border-radius:99px;padding:4px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.pill b{color:var(--accent);letter-spacing:.14em}
.panel{background:color-mix(in srgb,var(--surface) 90%,transparent);border:2px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 6px 0 #0006}
.row{display:flex;gap:10px;margin:10px 0}
input{flex:1;min-width:0;font:inherit;padding:13px 14px;border-radius:14px;border:3px solid #16101f;background:var(--bg);color:var(--ink)}
input.code{text-transform:uppercase;letter-spacing:.35em;text-align:center;font-weight:700;font-size:22px}
.btn{font:700 17px Figtree,sans-serif;padding:13px 16px;border-radius:16px;border:3px solid #16101f;background:var(--surface);color:var(--ink);cursor:pointer;flex:1;box-shadow:0 5px 0 #000a;transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #000a}
.btn.main{background:linear-gradient(var(--accent),color-mix(in srgb,var(--accent) 72%,#000));color:var(--on);width:100%;font-size:19px}
.btn.sm{padding:8px 12px;font-size:14px;flex:0 0 auto;box-shadow:0 3px 0 #000a}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn[aria-pressed=true]{background:color-mix(in srgb,var(--accent) 30%,var(--surface));border-color:var(--accent)}
.menu{display:flex;flex-direction:column;gap:14px;margin:6px 0 0}
.back{margin-bottom:8px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chr{width:100%;height:auto;display:block;overflow:visible}.pawn{width:var(--sz,52px);height:var(--sz,52px);display:block;overflow:visible}
.bob{animation:bob 2.6s ease-in-out infinite;transform-origin:60px 140px}@keyframes bob{50%{transform:translateY(-4px) scaleY(1.015)}}
.eye{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.glow{animation:pulse 1.5s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}
.bell{animation:swing 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes swing{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.flap{animation:flap 1.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:top left}@keyframes flap{to{transform:rotate(12deg)}}
.mag{animation:scan 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes scan{50%{transform:translate(-8px,-5px) rotate(-8deg)}}
.gone{filter:grayscale(1) brightness(.8);animation:fall .9s ease-in forwards}@keyframes fall{from{transform:none}to{transform:rotate(-12deg) translateY(8px)}}
.stage{display:flex;justify-content:center;align-items:flex-end;margin:0 -8px;position:relative;z-index:2}
.stage>div{width:27%;margin:0 -2%}.stage>div:nth-child(odd){margin-bottom:-8px}
.tag{display:inline-block;padding:4px 14px;border-radius:8px;border:3px solid #16101f;font:700 14px Figtree;background:var(--surface);transform:rotate(-2deg)}
.tag.mafia{background:var(--bad);color:#fff}.tag.town{background:var(--good);color:#06210f}.tag.solo{background:var(--accent);color:var(--on)}
.tbl{position:relative;width:min(100%,390px);aspect-ratio:1;margin:6px auto}
.felt{position:absolute;inset:17%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent2) 55%,var(--bg)),var(--bg2));border:7px solid color-mix(in srgb,var(--line) 80%,#000);box-shadow:inset 0 0 36px #000a,0 12px 28px #000a;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:2px}
.felt b{font:400 34px var(--disp);color:var(--accent)}.felt small{color:var(--muted);font-weight:600}.felt svg{color:var(--accent)}
.seat{position:absolute;transform:translate(-50%,-50%);width:calc(var(--sz) + 22px);background:none;border:0;color:var(--ink);display:flex;flex-direction:column;align-items:center;font:700 11px Figtree;cursor:default;padding:0;line-height:1.15;z-index:2}
button.seat{cursor:pointer}
.seat span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px #000}
.seat i{font-style:normal;font-weight:600;color:var(--muted)}
.seat.sel .pawn{transform:scale(1.2);filter:drop-shadow(0 0 10px var(--accent))}
.seat.me span{color:var(--accent)}
.seat.dead .pawn{filter:grayscale(1) brightness(.6)}.seat.dead span{text-decoration:line-through;opacity:.6}
.seat em{position:absolute;top:-6px;right:2px;background:var(--bad);color:#fff;font:700 11px Figtree;font-style:normal;border-radius:99px;padding:1px 7px;border:2px solid #16101f}
.rc{perspective:1000px;margin:14px auto;cursor:pointer;max-width:310px}
.rc>div{position:relative;height:430px;transition:transform .8s;transform-style:preserve-3d}.rc.on>div{transform:rotateY(180deg)}
.rc .f,.rc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:26px;border:5px solid #16101f;box-shadow:0 8px 0 #000a;overflow:hidden}
.rc .f{background:repeating-linear-gradient(45deg,var(--accent2) 0 14px,color-mix(in srgb,var(--accent2) 70%,#000) 14px 28px);display:flex;flex-direction:column;align-items:center;justify-content:center}
.rc .f b{font:400 120px var(--disp);color:var(--accent);-webkit-text-stroke:4px #16101f;text-shadow:0 6px 0 #16101f}
.rc .b{transform:rotateY(180deg);padding:14px;display:flex;flex-direction:column;align-items:center;text-align:center;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--accent) 35%,var(--surface)),var(--surface))}
.rc .b .chr{width:62%;margin:6px 0}.rc .b h1{margin:4px 0}.rc .b p{font-size:14px;margin:4px 0}
.timer{font:700 14px Figtree;color:var(--muted);display:flex;justify-content:space-between;margin:2px 0 6px}
.bar{height:10px;border-radius:9px;background:#0007;border:2px solid #16101f;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);transition:width .3s linear}
.react{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.bub{font:400 18px var(--disp);padding:7px 14px;border-radius:18px 18px 18px 4px;border:3px solid #16101f;background:#fff;color:#16101f;cursor:pointer;box-shadow:0 4px 0 #000a}
.fl{position:fixed;bottom:90px;font:400 30px var(--disp);padding:6px 16px;border-radius:20px 20px 20px 4px;border:3px solid #16101f;background:#fff;color:#16101f;animation:up 3s ease-out forwards;pointer-events:none;z-index:9}
@keyframes up{to{transform:translateY(-55vh) rotate(-6deg);opacity:0}}
.list{list-style:none;margin:0;padding:0}.list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.log li{display:block;color:var(--muted);font-size:14px}.log .h{color:var(--ink);font-weight:700;margin-top:8px}
.intel{border-left:5px solid var(--accent)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--bad);color:#fff;padding:12px 16px;border-radius:14px;font-weight:700;z-index:20;text-align:center;border:3px solid #16101f}
.dots{display:flex;gap:8px;justify-content:center;margin:10px 0}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent);transform:scale(1.3)}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.gal button{background:var(--surface);border:3px solid #16101f;border-radius:14px;padding:6px 4px 4px;color:var(--ink);font:700 11px Figtree;cursor:pointer;box-shadow:0 3px 0 #000a}
.gal button[aria-pressed=true]{background:color-mix(in srgb,var(--accent) 35%,var(--surface));border-color:var(--accent)}
.hero{width:min(60%,230px);margin:0 auto}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:-2px;border:2px solid #16101f}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid3>div{text-align:center;font-size:13px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hd{width:30px;height:30px;border-radius:50%;overflow:hidden;background:var(--bg);flex:none;border:2px solid #16101f}.hd svg{width:150%;margin:-25% 0 0 -25%}
.walkers{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 2px);height:90px;pointer-events:none;z-index:0;overflow:hidden}
.wk{position:absolute;bottom:0;animation:walk linear infinite}.wk .bob{animation-duration:.55s}
@keyframes walk{from{transform:translateX(-90px)}to{transform:translateX(calc(100vw + 90px))}}
.wk.r{animation-name:walkr}@keyframes walkr{from{transform:translateX(calc(100vw + 90px)) scaleX(-1)}to{transform:translateX(-90px) scaleX(-1)}}
.peeker{position:fixed;right:-6px;width:86px;z-index:3;pointer-events:none;animation:pk 5s ease-in-out forwards}
.peeker.l{right:auto;left:-6px;animation-name:pkl}
@keyframes pk{0%,100%{transform:translateX(110%) rotate(-20deg)}15%,80%{transform:translateX(22%) rotate(-20deg)}}
@keyframes pkl{0%,100%{transform:translateX(-110%) rotate(20deg)}15%,80%{transform:translateX(-22%) rotate(20deg)}}
.fly{position:fixed;left:0;width:46px;z-index:0;pointer-events:none;animation:fly 9s linear forwards}
.fly svg{width:100%;animation:flap2 .4s infinite alternate}@keyframes flap2{to{transform:scaleY(.4)}}
@keyframes fly{from{transform:translateX(-60px)}to{transform:translate(calc(100vw + 60px),-40px)}}
.stars,.clouds{position:fixed;inset:0;pointer-events:none;z-index:0;transition:opacity 1.2s;overflow:hidden}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 2.5s infinite alternate}
.clouds i{position:absolute;left:-30%;width:150px;height:40px;border-radius:40px;background:rgba(255,255,255,.55);filter:blur(2px);animation:cl linear infinite}
@keyframes cl{to{transform:translateX(170vw)}}
[data-phase=day] .stars{opacity:0}[data-phase=night] .clouds{opacity:0}
.splash{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(circle,rgba(0,0,0,.25),rgba(0,0,0,.85));animation:sp 1.9s ease forwards;overflow:hidden}
@keyframes sp{0%{opacity:0}14%,72%{opacity:1}100%{opacity:0}}
.splash h1{color:var(--accent);-webkit-text-stroke:2px #16101f;paint-order:stroke fill;text-shadow:0 5px 0 #16101f;animation:zoom .6s cubic-bezier(.2,1.5,.4,1) both;text-align:center}
.splash svg{animation:zoom .6s cubic-bezier(.2,1.5,.4,1) both}
@keyframes zoom{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.slash{position:absolute;left:-10%;top:42%;width:120%;height:12px;background:#ff2d4a;box-shadow:0 0 36px #f00;transform:rotate(-20deg) scaleX(0);animation:sl .45s .25s forwards}
@keyframes sl{to{transform:rotate(-20deg) scaleX(1)}}
.cf{position:fixed;top:-16px;width:10px;height:15px;z-index:25;pointer-events:none;animation:cf 3.6s linear forwards}
@keyframes cf{to{transform:translateY(108vh) rotate(760deg)}}
.rc .b::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);transform:translateX(-130%);animation:shine 3.2s infinite;pointer-events:none}
@keyframes shine{60%,100%{transform:translateX(130%)}}
.rc.on>div{animation:float 3s ease-in-out infinite .8s}@keyframes float{50%{margin-top:-8px}}
.seat .pawn{animation:idle 3s ease-in-out infinite}@keyframes idle{50%{transform:translateY(-3px)}}
.seat.sel .pawn{animation:selp .8s ease-in-out infinite}@keyframes selp{50%{transform:scale(1.3)}}
.seat.dead .pawn{animation:none}
.btn.main:not(:disabled){animation:cta 2.4s ease-in-out infinite}@keyframes cta{50%{filter:brightness(1.14)}}
.logo span:first-child{animation:flick 5s infinite}@keyframes flick{0%,91%,100%{opacity:1}93%{opacity:.55}95%{opacity:1}97%{opacity:.5}}
.stage>div{animation:rise .8s backwards cubic-bezier(.2,1.4,.4,1)}@keyframes rise{from{transform:translateY(130%) scale(.6);opacity:0}}
.bob.jump{animation:jump .65s ease-in-out infinite}@keyframes jump{50%{transform:translateY(-16px)}}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 16px 16px;margin:0 -16px}
.mc{flex:0 0 140px;scroll-snap-align:center;background:var(--surface);color:var(--ink);border:3px solid #16101f;border-radius:20px;padding:8px 8px 12px;text-align:center;cursor:pointer;box-shadow:0 5px 0 #000a;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;transition:transform .2s}
.mc b{font:400 19px var(--disp)}.mc small{color:var(--muted);font-size:12px;line-height:1.2}.mchr{width:78%}
.mc.on{border-color:var(--accent);transform:translateY(-8px) scale(1.04);background:color-mix(in srgb,var(--accent) 22%,var(--surface));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 40%,transparent),0 0 26px color-mix(in srgb,var(--accent) 50%,transparent)}
.rules{margin:10px 0 0;padding:0;list-style:none}.rules li{padding:5px 0 5px 24px;position:relative;font-size:15px}
.rules li::before{content:"";position:absolute;left:2px;top:11px;width:10px;height:10px;background:var(--accent);transform:rotate(45deg);border:2px solid #16101f}
.th{border:3px solid #16101f;border-radius:14px;color:#fff;font:700 13px Figtree;padding:18px 4px 10px;cursor:pointer;text-shadow:0 1px 2px #000;box-shadow:0 4px 0 #000a}
.th[aria-pressed=true]{outline:3px solid var(--accent);outline-offset:2px;transform:translateY(-3px)}
.gal button{position:relative}.gal button[aria-pressed=true]::after{content:"\2713";position:absolute;top:-8px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on);font:700 14px/22px Figtree;border:2px solid #16101f}
.gal button[aria-pressed=false]{opacity:.55}
.seg{display:flex;border:3px solid #16101f;border-radius:14px;overflow:hidden;box-shadow:0 4px 0 #000a}
.seg button{flex:1;padding:10px 4px;background:var(--surface);color:var(--ink);border:0;border-right:2px solid #16101f;font:700 14px Figtree;cursor:pointer}.seg button:last-child{border:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on)}
.tog{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:10px 14px;border:3px solid #16101f;border-radius:14px;background:var(--surface);color:var(--ink);font:700 15px Figtree;cursor:pointer;box-shadow:0 4px 0 #000a;text-align:left}
.tog i{flex:none;width:48px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;border:2px solid #16101f}
.tog i::after{content:"";position:absolute;top:1px;left:1px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.tog[aria-pressed=true] i{background:var(--accent)}.tog[aria-pressed=true] i::after{transform:translateX(22px)}

body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5))}
.beams{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;transition:opacity 1.2s}
.beams i{position:absolute;top:-12%;width:34%;height:110%;background:linear-gradient(180deg,rgba(255,238,190,.2),transparent 75%);transform-origin:top center;filter:blur(10px);animation:sweep 9s ease-in-out infinite alternate}
@keyframes sweep{from{transform:rotate(-24deg)}to{transform:rotate(22deg)}}
[data-phase=day] .beams{opacity:.35}
.embers{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.embers i{position:absolute;bottom:-10px;width:var(--s);height:var(--s);border-radius:50%;background:var(--accent);box-shadow:0 0 10px 2px var(--accent);opacity:0;animation:emb linear infinite}
@keyframes emb{0%{transform:translate(0,0);opacity:0}12%{opacity:.85}60%{transform:translate(24px,-60vh)}100%{transform:translate(-18px,-108vh);opacity:0}}
.shoot{position:fixed;width:110px;height:2px;background:linear-gradient(90deg,#fff,transparent);pointer-events:none;z-index:0;animation:shoot 1.2s ease-out forwards}
@keyframes shoot{from{transform:translate(0,0) rotate(32deg);opacity:1}to{transform:translate(-280px,175px) rotate(32deg);opacity:0}}
.orb{animation:orbp 6s ease-in-out infinite}@keyframes orbp{50%{transform:scale(1.08)}}
.page>*:not(.logo){animation:cin .55s backwards cubic-bezier(.2,.9,.3,1)}
.page>*:nth-child(2){animation-delay:.06s}.page>*:nth-child(3){animation-delay:.12s}.page>*:nth-child(4){animation-delay:.18s}.page>*:nth-child(5){animation-delay:.24s}.page>*:nth-child(n+6){animation-delay:.3s}

/* ---------- host game engine ---------- */
async function put(p){Object.assign(S,p);try{await ref().set(S)}catch(e){}}

  const done=()=>alive().every(p=>(ph==='trial'&&p.id===S.accused)||(P[p.id]&&P[p.id].act&&P[p.id].act.k===key()));
  if(ph==='reveal'&&t>S.ends)go(startNight);
  else if(ph==='night'&&(t>S.ends||done()))go(resolveNight);
  else if(ph==='dawn'&&t>S.ends)go(()=>S.winner?put({phase:'over'}):put({phase:'day',ends:now()+dsec()*1000,dur:dsec()*1000}).then(()=>say('Day breaks. Discuss and find the Mafia.')));

async function startGame(){
  const ids=Object.keys(P),n=ids.length,o=S.opts,chaos=S.mode==='chaos';

  ids.sort(()=>Math.random()-.5);
  await put({g:S.g+1,round:0,phase:'reveal',players:ids.map((id,i)=>({id,name:P[id].name,role:roles[i],alive:true})),mayor:S.mode==='mayor'?ids[0]:null,turned:[],infected:null,accused:null,log:[],det:{},used:{},dawn:[],tally:null,winner:null,out:null,ends:now()+20000,dur:20000});

async function resolveNight(){
  const k=key(),pl=S.players,acts=id=>{const a=P[id]&&P[id].act;return a&&a.k===k?a.t:null};
  const al=pl.filter(p=>p.alive),tally={};
  al.filter(isM).forEach(p=>{const t=acts(p.id);if(t)tally[t]=(tally[t]||0)+1});
  const ks=Object.keys(tally),best=Math.max(0,...ks.map(x=>tally[x])),top=ks.filter(x=>tally[x]===best);
  const kill=top.length?top[Math.floor(Math.random()*top.length)]:null;
  const doc=al.find(p=>p.role==='doctor'),save=doc?acts(doc.id):null;
  const vg=al.find(p=>p.role==='vigilante'),vt=vg&&!S.used[vg.id]?acts(vg.id):null,used={...S.used};if(vt)used[vg.id]=1;
  const det={...S.det},dt=al.find(p=>p.role==='detective');
  if(dt){const t=acts(dt.id);if(t){const tp=pl.find(p=>p.id===t);det[dt.id]=[...(det[dt.id]||[]),`Night ${S.round}: ${tp.name} is ${tp.role==='mafia'?'Mafia':'not Mafia'}.`]}}
  const log=[...S.log,'Night '+S.round],dead=[];
  [[S.mode==='outbreak'?null:kill,'the Mafia'],[vt,'the Vigilante']].forEach(([t,by])=>{if(!t)return;if(t===save){log.push(`${nm(t)} was attacked by ${by}, but the Doctor saved them.`);return}if(!dead.includes(t)){dead.push(t);const p=pl.find(x=>x.id===t);log.push(`${p.name}${rn(p.role)} was killed by ${by}.`)}});
  if(!dead.length)log.push('No one died.');

  const players=pl.map(p=>dead.includes(p.id)?{...p,alive:false}:p.id===inf?{...p,role:'mafia'}:p);
  await put({players,log,det,used,turned,infected:inf,dawn:dead,winner:winOf(players),phase:'dawn',ends:now()+9000,dur:9000});
  say(dead.length?dead.map(nm).join(' and ')+' did not survive the night.':'Everyone survived the night.');
}
async function startVote(){const d=S.mode==='speed'?25000:50000;await put({phase:'vote',ends:now()+d,dur:d});say('Time to vote.')}
async function resolveVote(){
  const k=key(),votes={},cnt={};
  alive().forEach(p=>{const a=P[p.id]&&P[p.id].act;if(a&&a.k===k&&a.t){votes[p.id]=a.t;cnt[a.t]=(cnt[a.t]||0)+(p.id===S.mayor?2:1)}});
  const ids=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]),tie=ids.length>1&&cnt[ids[0]]===cnt[ids[1]],out=ids.length&&!tie?ids[0]:null;
  if(S.mode==='courtroom'&&out){await put({phase:'trial',accused:out,tally:{cnt,votes},ends:now()+35000,dur:35000,log:[...S.log,'Day '+S.round+' vote',`${nm(out)} was put on trial.`]});say(nm(out)+' is on trial. Defend yourself.');return}
  const log=[...S.log,'Day '+S.round+' vote',ids.length?ids.map(i=>`${nm(i)}: ${cnt[i]}`).join(', '):'Everyone skipped.'];
  let players=S.players,w=null;
  if(out){const o=players.find(p=>p.id===out);players=players.map(p=>p.id===out?{...p,alive:false}:p);log.push(`${o.name}${rn(o.role)} was voted out.`);if(o.role==='jester')w='jester'}else log.push('No one was eliminated.');
  await put({players,log,winner:w||winOf(players),out,tally:{cnt,votes},phase:'result',ends:now()+10000,dur:10000});
  say(out?nm(out)+' was voted out.':'No one was eliminated.');
}


async function resolveTrial(){
  const k=key(),acc=S.accused;let g=0,i=0;
  alive().forEach(p=>{if(p.id===acc)return;const a=P[p.id]&&P[p.id].act;if(a&&a.k===k){if(a.t==='g')g++;else if(a.t==='i')i++}});
  const guilty=g>i,log=[...S.log,`Trial: ${g} guilty, ${i} innocent.`];
  let players=S.players,w=null,out=null;
  if(guilty){out=acc;const o=players.find(p=>p.id===acc);players=players.map(p=>p.id===acc?{...p,alive:false}:p);log.push(`${o.name}${rn(o.role)} was found guilty and eliminated.`);if(o.role==='jester')w='jester'}else log.push(`${nm(acc)} was found innocent.`);
  await put({players,log,winner:w||winOf(players),out,tally:{cnt:{},votes:{},g,i},phase:'result',ends:now()+10000,dur:10000});
  say(guilty?nm(acc)+' was found guilty.':nm(acc)+' was found innocent.');
}


/* ---------- standalone backend (replaces Claude's db) ---------- */
function uid(){let u=null;try{u=localStorage.getItem('mafia-uid')}catch(e){}if(!u){u=Array.from({length:20},()=>'abcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random()*36)]).join('');try{localStorage.setItem('mafia-uid',u)}catch(e){}}return u}
function makeDb(){
  const U=uid();
  const post=async(op,path,data)=>{const r=await fetch('/api/'+op,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path,data,uid:U})});if(!r.ok)throw new Error('http '+r.status);return r.json()};
  const snap=(id,v)=>({id,exists:v!=null,data:()=>v==null?undefined:v});
  const doc=path=>{const id=path.split('/').pop();return{id,path,
    async get(){const r=await fetch('/api/get?path='+encodeURIComponent(path));if(!r.ok)throw new Error('http '+r.status);return snap(id,(await r.json()).data)},
    set:d=>post('set',path,d).then(()=>{}),update:d=>post('update',path,d).then(()=>{}),
    onSnapshot(next){const es=new EventSource('/api/sub?path='+encodeURIComponent(path));es.onmessage=e=>next(snap(id,JSON.parse(e.data).data));return()=>es.close()}}};
  const collection=path=>({onSnapshot(next){const es=new EventSource('/api/sub?col=1&path='+encodeURIComponent(path));es.onmessage=e=>{const m=JSON.parse(e.data).docs;next({docs:Object.keys(m).map(id=>snap(id,m[id]))})};return()=>es.close()}});
  return{doc,collection};
}

    const wins=p=>S.winner==='town'?(!isM(p)&&p.role!=='jester'):S.winner==='mafia'?isM(p):p.role==='jester';
    const w={town:['The town wins','t-town'],mafia:['The Mafia wins','t-mafia'],jester:['The Jester wins','t-solo']}[S.winner];
    h+=`<div class="c" style="padding-top:8px"><h1 class="big ${w[1]}">${w[0]}</h1></div><div class="panel"><div class="grid3">${S.players.map(p=>`<div>${chr(p.role,hue(p.id),wins(p)?'cheer':p.alive?'':'dead')}<div>${esc(p.name)}</div><span class="tag ${R[p.role][2]}">${R[p.role][0]}</span></div>`).join('')}</div></div><h2>Recap</h2><div class="panel"><ul class="list log">${S.log.map(l=>`<li class="${/^(Night|Day) \d+/.test(l)?'h':''}">${esc(l)}</li>`).join('')}</ul></div>${isHost?'<button class="btn main" data-act="rematch">Rematch in the same room</button>':'<p class="sub c">The host can start a rematch.</p>'}<p class="c" style="margin-top:14px"><button class="btn sm" data-act="leave">Leave room</button></p>`;
  }
  const sc=$('.car'),sl=sc?sc.scrollLeft:0;
  app.innerHTML=h+'</div>';const c2=$('.car');if(c2)c2.scrollLeft=sl;clock();fx(ph);
}
function clock(){
  if(!S||!$('#tm'))return;const left=Math.max(0,S.ends-now());
  $('#tm').textContent=Math.ceil(left/1000)+'s';$('#tb').style.width=Math.min(100,left/S.dur*100)+'%';const bb=$('.bar');if(bb)bb.classList.toggle('hot',left<10000&&left>0);
  if(S.phase==='day'&&Math.ceil(left/1000)===10&&!clock.b){clock.b=1;beep(1)}if(left>11000)clock.b=0;
}

/* ---------- actions ---------- */
const w=async f=>{try{await f()}catch(e){toast('Could not save. Check your connection.')}};
const A={
  nav(v){page=v;if(v==='how')how=0;menu()},
  hstep(v){how+=+v;if(how>=HOW.length){page='title';how=0}menu()},
  cpick(v){csel=v;menu()},
  theme(v){theme=v;try{localStorage.setItem('mafia-theme',v)}catch(e){}menu()},
  snd(){snd=!snd;try{localStorage.setItem('mafia-snd',snd?'1':'0')}catch(e){}menu()},
  create(){const c=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random()*24)]).join('');enter(c,$('#nm').value.trim(),true)},
  join(){const c=$('#cd').value.trim().toUpperCase();if(c.length!==4)return toast('Enter the 4-letter code');enter(c,$('#nm').value.trim(),false)},
  set(v,el){w(()=>put({[el.dataset.k]:v}))},
  opt(v){w(()=>put({opts:{...S.opts,[v]:!S.opts[v]}}))},
  secs(v){w(()=>put({secs:+v}))},
  start(){go(startGame)},
  peek(){peek=!peek;render()},
  sel(v){sel=sel===v?null:v;render()},
  lock(v){const t=v==='skip'?null:sel;w(()=>pref(me).update({act:{k:key(),t}}))},
  sus(v){const cur=P[me]&&P[me].sus;w(()=>pref(me).update({sus:cur===v?null:v}))},
  emo(v){w(()=>pref(me).update({react:{e:v,ts:now()}}))},
  more(){w(()=>put({ends:S.ends+30000,dur:S.dur+30000}))},
  tovote(){go(startVote)},
  rematch(){w(()=>put({phase:'lobby',players:[],winner:null,round:0}))},
  verdict(v){w(()=>pref(me).update({act:{k:key(),t:v}}))},
  invite(){const u=location.origin+location.pathname+'?room='+S.code;if(navigator.share)navigator.share({title:'Mafia Night',text:'Join my Mafia game, room '+S.code,url:u}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>toast('Invite link copied'),()=>toast(u));else toast(u)},
  leave
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled&&A[b.dataset.act])A[b.dataset.act](b.dataset.v,b)});
document.addEventListener('input',e=>{if(e.target.id==='nm'){myName=e.target.value.trim();try{localStorage.setItem('mafia-name',myName)}catch(x){}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('rc'))A.peek()});

/* ---------- effects ---------- */
let lastFx='',lastPk='';
function confetti(cols){for(let i=0;i<70;i++){const d=document.createElement('div');d.className='cf';d.style.cssText=`left:${Math.random()*100}%;background:${cols[i%cols.length]};animation-delay:${Math.random()*1.2}s;animation-duration:${2.6+Math.random()*1.8}s`;document.body.appendChild(d);setTimeout(()=>d.remove(),6500)}}
function fx(ph){
  const k=S.g+':'+S.round+':'+ph;if(k===lastFx)return;lastFx=k;
  const m={reveal:['Roles dealt','moon'],night:['Night '+S.round,'moon'],dawn:[S.dawn.length?'Blood at dawn':'A quiet dawn','sun'],day:['Day '+S.round,'sun'],vote:['Time to vote','vote'],trial:['Trial','vote'],over:[{town:'Town wins',mafia:'Mafia wins',jester:'Jester wins'}[S.winner]||'Game over','crown']}[ph];
  if(!m)return;
  const d=document.createElement('div');d.className='splash';d.innerHTML=`${ph==='dawn'&&S.dawn.length?'<div class="slash"></div>':''}<div class="t-solo">${svgi(m[1],70)}</div><h1 class="big">${m[0]}</h1>`;document.body.appendChild(d);setTimeout(()=>d.remove(),1900);
  if(ph==='over')confetti(S.winner==='mafia'?['#ff3b5c','#8c1d2c','#555']:['#e0a93f','#19f0d0','#fff','#ff2e93']);
}
function ambient(){
  const mk=(c,h)=>{const d=document.createElement('div');d.className=c;d.innerHTML=h;document.body.appendChild(d);return d};
  mk('beams','<i style="left:6%"></i><i style="left:60%;animation-delay:-4.5s"></i>');
  mk('stars',Array.from({length:40},()=>`<i style="left:${Math.random()*100}%;top:${Math.random()*55}%;animation-delay:-${Math.random()*3}s;scale:${.5+Math.random()}"></i>`).join(''));
  mk('clouds',[0,1,2].map(i=>`<i style="top:${8+i*12}%;animation-duration:${60+i*25}s;animation-delay:-${i*20}s"></i>`).join(''));
  mk('embers',Array.from({length:24},()=>`<i style="left:${Math.random()*100}%;--s:${2+Math.random()*4}px;animation-duration:${9+Math.random()*10}s;animation-delay:-${Math.random()*14}s"></i>`).join(''));
  setInterval(()=>{if(document.documentElement.dataset.phase!=='night')return;const d=mk('shoot','');d.style.top=(4+Math.random()*25)+'%';d.style.left=(45+Math.random()*50)+'%';setTimeout(()=>d.remove(),1300)},9000);
}
window.addEventListener('load',()=>{menu();init();ambient()});
</script>
</body>
</html>
